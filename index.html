"use strict";

/* ============ 基础工具 ============ */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============ 数据存取（本机浏览器） ============ */
const STORE_KEY = "cehui_zhixing_data_v2";
const memory = {};
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return memory; }
}
function persistData() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(memory)); }
  catch (e) { /* 无本地存储时仅保存在内存中 */ }
}
const data = loadData();
Object.assign(memory, data);

let saveTimer = null;
function markSaved() {
  const tip = $("saveTip");
  tip.textContent = "数据已自动保存 ✓";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { tip.textContent = ""; }, 2500);
}
function collectAll() {
  TABLES.forEach(t => collectTable(t.id));
  persistData();
  markSaved();
}

/* ============ 视频与指南 ============ */
const GUIDE_HTML = `
<div class="guide">
  <h3 id="sec-prep">一、操作前准备（通用）</h3>
  <h4>1.1 架设与对中整平</h4>
  <ul>
    <li>选好测站：地面平整、坚硬、视野开阔无遮挡，能看到所有待测/放样点位。</li>
    <li>张开三脚架，三脚脚距尽量相等，高度至胸口，踩实脚架腿防止晃动。</li>
    <li>安装仪器，用光学/激光对中器粗略对中，再整平：先调圆水准器使气泡居中，再用管水准器精平（转动脚螺旋使气泡在各方向均居中）。</li>
    <li>确认电池电量≥2 格，棱镜常数与仪器设置一致（南方常用 0mm 或 -30mm）。</li>
  </ul>
  <h4>1.2 参数设置（开机后）</h4>
  <table>
    <tr><th>参数</th><th>建议设置</th></tr>
    <tr><td>棱镜常数</td><td>0mm（单棱镜）或 -30mm（带杆棱镜），需与所用棱镜匹配</td></tr>
    <tr><td>温度 / 气压</td><td>输入实时值，用于大气折光改正，提高测距精度</td></tr>
    <tr><td>角度单位</td><td>度分秒（DMS）</td></tr>
    <tr><td>距离单位</td><td>米（m）</td></tr>
  </table>
  <p>进入路径：MENU → 参数设置（键盘式）；或主菜单 → 设置（图标式）。</p>

  <h3 id="sec-station">二、已知点建站</h3>
  <p>「已知点建站」是告诉仪器“我在哪里、朝哪个方向”，是后续测量与放样的基准。需已知：测站点坐标（N, E, Z）与后视点坐标（N, E）。</p>
  <h4>2.1 进入路径</h4>
  <table>
    <tr><th>机型类型</th><th>菜单进入方式</th></tr>
    <tr><td>键盘功能键式（NTS-352/362 等）</td><td>MENU → F1（建站/测量）→ 选择“已知点建站”</td></tr>
    <tr><td>触屏图标菜单式（NTS-360/600/660 等）</td><td>主菜单 → 建站 → 1.已知点建站</td></tr>
  </table>
  <h4>2.2 通用操作步骤</h4>
  <ol>
    <li>（建项目）开机后新建项目/文件并命名（如 ST01），按 ENT 确认。</li>
    <li>（输坐标）在“数据→坐标数据”中先录入测站点与后视点的坐标（点名、N北坐标、E东坐标、Z高程）。</li>
    <li>（设测站）选择“已知点建站”，从已知点中选取建站点编号，输入仪器高，确认。</li>
    <li>（设后视）选取后视点坐标，瞄准后视点棱镜中心，按“设置/是”完成定向。</li>
    <li>（检核）定向后可测一次后视距离，若与已知边长差≤3cm 即建站成功；否则检查坐标输入与瞄准。</li>
  </ol>
  <p><b>提示：</b>建站完成后务必先测一个已知点的坐标进行比对，误差不大再继续作业——一旦测站或后视点号搞错，该站所测碎部点将全部报废。</p>

  <h3 id="sec-measure">三、点测量</h3>
  <p>已知点建站完成后，即可测量未知点的三维坐标（N, E, Z）。</p>
  <h4>3.1 进入路径</h4>
  <table>
    <tr><th>机型类型</th><th>菜单进入方式</th></tr>
    <tr><td>键盘式</td><td>建站后进入坐标测量模式（F1 测量 → 坐标测量）</td></tr>
    <tr><td>图标式</td><td>主菜单 → 采集 → 点测量</td></tr>
  </table>
  <h4>3.2 通用操作步骤</h4>
  <ol>
    <li>输入点名（如 P01），如需变棱镜高则修改镜高（多个棱镜同时作业务必保证镜高一致）。</li>
    <li>指挥棱镜员将棱镜架于待测点位并整平，转动仪器经望远镜照准棱镜中心（调焦至清晰）。</li>
    <li>按“测距/测量”键，待水平角、垂直角、斜距数据稳定后，按“记录/保存”（图标式可直接按“测存”一次完成测量并保存）。</li>
    <li>输入点号并确认，数据自动存入仪器内存；测下一点时重复瞄准—测量—记录即可，无需重新建站。</li>
  </ol>
  <p><b>提高精度：</b>对同一未知点观测 3 次取均值（图标式可用“均值测量”），可显著降低随机误差。</p>

  <h3 id="sec-stakeout">四、点放样</h3>
  <p>点放样是把设计坐标“放”到实地：仪器计算放样点方向，指挥棱镜员移动到目标位置，使角度差与距离差归零。需已知建站点、后视点、放样点三者坐标。</p>
  <h4>4.1 进入路径</h4>
  <table>
    <tr><th>机型类型</th><th>菜单进入方式</th></tr>
    <tr><td>键盘式（NTS-600 等）</td><td>按 S.O（放样）键 → F3 跳过选文件 → 进入坐标放样</td></tr>
    <tr><td>图标式</td><td>主菜单 → 程序 → 放样 → 点放样</td></tr>
  </table>
  <h4>4.2 通用操作步骤</h4>
  <ol>
    <li>输入测站点坐标（N, E, Z）并确认，输入仪器高。</li>
    <li>输入后视点坐标（N, E），照准后视点棱镜，按“是/设置”确认方位角。</li>
    <li>输入放样点坐标（N, E, Z），输入棱镜高，仪器计算放样参数。</li>
    <li>旋转仪器使水平角差 dHR = 0°00′00″ 并制动，此时望远镜竖丝方向即为放样点方向；指挥棱镜员将棱镜置于该方向上。</li>
    <li>按“距离”键，屏幕显示 dH（棱镜到放样点的水平距离差）/ dHD：棱镜员前后移动，直至 dH（dHD）≈ 0，棱镜杆尖所在位置即为放样点。</li>
    <li>按“换点/下一点”返回，输入下一个放样点坐标，重复步骤 3–5。</li>
  </ol>
  <p><b>读数与移动关系：</b>dHD 为“+”表示棱镜需向仪器方向移动；为“−”表示需向远离仪器方向移动。</p>

  <h3 id="sec-height">五、悬高测量</h3>
  <p>悬高测量（REM）用于测定“无法放置棱镜的高处目标”的高度（如房檐、高压线、桥梁底面）。原理：在目标点所在铅垂线上任选一点架设棱镜，测得棱镜位置后，再照准高处目标即可算得悬高。</p>
  <h4>5.1 进入路径</h4>
  <table>
    <tr><th>机型类型</th><th>菜单进入方式</th></tr>
    <tr><td>键盘式</td><td>MENU → F4 翻页第 2 页 → F1 程序 → F1 悬高测量</td></tr>
    <tr><td>图标式</td><td>主菜单 → 采集 → 悬高测量</td></tr>
  </table>
  <h4>5.2 方式一：有棱镜高输入（以棱镜为基点）</h4>
  <ol>
    <li>进入悬高测量，选择“输入镜高（有棱镜高）”。</li>
    <li>输入棱镜高 h（如 1.3m）并确认。</li>
    <li>照准铅垂线上架设的棱镜 P，按“测量”，显示仪器至棱镜的水平距离 HD。</li>
    <li>按“设置”确定棱镜位置（棱镜点被锁定）。</li>
    <li>照准高处目标 K，屏幕直接显示目标相对棱镜的垂直距离 VD（悬高）。</li>
  </ol>
  <h4>5.3 方式二：无棱镜高输入（以地面为基准点）</h4>
  <ol>
    <li>进入悬高测量，选择“无需镜高（无棱镜高模式）”。</li>
    <li>照准铅垂线上棱镜，按“测量”显示平距 HD，按“设置”确认水平距离。</li>
    <li>照准地面点（目标铅垂线与地面的交点），按“设置”确定基准点。</li>
    <li>照准高处目标 K，屏幕显示目标到地面的高差 VD，即完整悬高。</li>
  </ol>
  <p><b>两种方式的区别：</b>有棱镜高时以棱镜为基准，需量取棱镜高；无棱镜高时以地面为基准，需额外照准一次地面点。按 F2（镜高）/F3（平距）可返回上一步重测。</p>

  <h3 id="sec-safety">六、安全与精度注意事项</h3>
  <ul>
    <li>NTS 系列发射激光，严禁用眼睛直视望远镜发射口。</li>
    <li>强光下长期作业应架太阳伞保护仪器；避免暴晒、淋雨。</li>
    <li>建站后先测已知点点位比对，确认无误再继续测量。</li>
    <li>棱镜常数务必与所用棱镜一致（0mm / -30mm），否则距离整体偏差。</li>
    <li>输入坐标时 X/N 与 Y/E 切勿输反（南方仪器中 N 为北坐标、E 为东坐标）。</li>
    <li>测距前输入实时温度、气压做气象改正；长距离测量建议多次观测取均值。</li>
    <li>作业完毕及时导出数据（菜单 → 内存管理/存储 → 数据导出），建议存两份（电脑+U盘）；关机前勿直接拔电池，先正常关机再盖镜头盖。</li>
  </ul>

  <h3 id="sec-faq">七、常见问题速查</h3>
  <table>
    <tr><th>现象</th><th>排查方向</th></tr>

function buildRows(t) {
  const tbody = document.querySelector(`#tbl-${t.id} tbody`);
  const n = (data[t.id] && data[t.id].rowCount) || t.defaultRows;
  tbody.innerHTML = "";
  for (let i = 1; i <= n; i++) tbody.appendChild(rowHTML(t, i));
}

function rowHTML(t, idx) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="no">${idx}</td>`;
  t.cols.forEach((c, ci) => {
    const auto = t.auto && t.auto.some(a => a[0] === ci);
    if (auto) {
      tr.innerHTML += `<td><input id="c-${t.id}-${idx}-${ci}" class="auto" readonly></td>`;
    } else {
      tr.innerHTML += `<td><input id="c-${t.id}-${idx}-${ci}" oninput="collectAll();calcRow('${t.id}',${idx})"></td>`;
    }
  });
  return tr;
}

function calcRow(id, idx) {
  const t = TABLES.find(x => x.id === id);
  if (t.auto) {
    t.auto.forEach(([out, a, b]) => {
      const va = parseFloat($("c-" + id + "-" + idx + "-" + a).value);
      const vb = parseFloat($("c-" + id + "-" + idx + "-" + b).value);
      const outEl = $("c-" + id + "-" + idx + "-" + out);
      outEl.value = (!isNaN(va) && !isNaN(vb)) ? (vb - va).toFixed(3) : "";
    });
  }
}

function recalcAll(id) {
  const t = TABLES.find(x => x.id === id);
  const n = data[t.id] ? (data[t.id].rowCount || t.defaultRows) : t.defaultRows;
  for (let i = 1; i <= n; i++) calcRow(id, i);
}

function addRow(id) {
  const t = TABLES.find(x => x.id === id);
  const tbody = document.querySelector(`#tbl-${id} tbody`);
  const n = tbody.children.length + 1;
  tbody.appendChild(rowHTML(t, n));
  collectAll();
  $("tbl-" + id).scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function delRow(id) {
  const tbody = document.querySelector(`#tbl-${id} tbody`);
  if (tbody.children.length <= 1) return;
  tbody.removeChild(tbody.lastChild);
  collectAll();
}

/* ============ 数据收集 / 恢复 ============ */
function collectTable(id) {
  const t = TABLES.find(x => x.id === id);
  if (!t) return;
  const tbody = document.querySelector(`#tbl-${id} tbody`);
  if (!tbody) return; // 表格未显示时保留已保存的数据
  const obj = { header:{}, station:{}, orient:{}, rows:[] };
  t.header.forEach(f => obj.header[f.k] = val("hdr-" + id + "-" + f.k));
  if (t.station) t.station.fields.forEach(f => obj.station[f.k] = val("sta-" + id + "-" + f.k));
  if (t.orient) t.orient.fields.forEach(f => obj.orient[f.k] = val("ori-" + id + "-" + f.k));
  obj.rowCount = tbody.children.length;
  tbody.querySelectorAll("tr").forEach(tr => {
    const row = [];
    tr.querySelectorAll("input").forEach(inp => row.push(inp.value));
    obj.rows.push(row);
  });
  data[id] = obj;
}

function val(id) {
  const el = $(id);
  return el ? el.value : "";
}

function restoreTable(t) {
  const obj = data[t.id];
  if (!obj) return;
  t.header.forEach(f => {
    const el = $("hdr-" + t.id + "-" + f.k);
    if (el) el.value = obj.header[f.k] || "";
  });
  if (t.station) t.station.fields.forEach(f => {
    const el = $("sta-" + t.id + "-" + f.k);
    if (el) el.value = (obj.station && obj.station[f.k]) || "";
  });
  if (t.orient) t.orient.fields.forEach(f => {
    const el = $("ori-" + t.id + "-" + f.k);
    if (el) el.value = (obj.orient && obj.orient[f.k]) || "";
  });
  document.querySelectorAll(`#tbl-${t.id} tbody tr`).forEach((tr, i) => {
    tr.querySelectorAll("input").forEach((inp, ci) => {
      if (obj.rows[i]) inp.value = obj.rows[i][ci] || "";
    });
  });
}

function fillRows(id, rows) {
  const t = TABLES.find(x => x.id === id);
  const tbody = document.querySelector(`#tbl-${id} tbody`);
  while (tbody.children.length > rows.length) tbody.removeChild(tbody.lastChild);
  for (let i = 0; i < rows.length; i++) {
    if (!tbody.children[i]) tbody.appendChild(rowHTML(t, i + 1));
    const tr = tbody.children[i];
    tr.querySelectorAll("input").forEach((inp, ci) => { inp.value = rows[i][ci] || ""; });
  }
}

function clearTable(id) {
  if (!confirm("确定清空「" + (TABLES.find(x => x.id === id) || {}).title + "」的所有数据吗？")) return;
  const box = document.getElementById("tab-table");
  ["hdr-", "sta-", "ori-"].forEach(prefix => {
    box.querySelectorAll('input[id^="' + prefix + id + '-"]').forEach(inp => inp.value = "");
  });
  box.querySelectorAll('input[id^="c-' + id + '-"]').forEach(inp => { if (!inp.readOnly) inp.value = ""; });
  data[id] = { header:{}, station:{}, orient:{}, rows:[] };
  persistData();
  markSaved();
}

/* ============ 导出 CSV ============ */
function exportCSV(id) {
  const t = TABLES.find(x => x.id === id);
  collectTable(id);
  const lines = [[t.title], []];
  const info = loadStudentInfo();
  if (info.sid || info.name || info.cls || info.grp) {
    lines.push(["学号", info.sid || ""], ["姓名", info.name || ""], ["班级", info.cls || ""], ["组别", info.grp || ""]);
    lines.push([]);
  }
  t.header.forEach(f => lines.push([f.label, data[id].header[f.k] || ""]));
  if (t.station) lines.push([t.station.label, ...t.station.fields.map(f => data[id].station[f.k] || "")]);
  if (t.orient) lines.push([t.orient.label, ...t.orient.fields.map(f => data[id].orient[f.k] || "")]);
  lines.push([]);
  lines.push(["序号", ...t.cols]);
  data[id].rows.forEach((r, i) => lines.push([i + 1, ...r]));
  const csv = "\uFEFF" + lines.map(l => l.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = t.title + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

function csvCell(v) {
  v = String(v == null ? "" : v);
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

/* ============ 启动 ============ */
/* ============ 学生信息与云端提交 ============ */
const STUDENT_KEY = "cehui_student_info";
function loadStudentInfo() {
  try { return JSON.parse(localStorage.getItem(STUDENT_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveStudentInfo() {
  const info = {
    cls: $("si-cls") ? $("si-cls").value.trim() : "",
    grp: $("si-grp") ? $("si-grp").value.trim() : "",
    sid: $("si-sid") ? $("si-sid").value.trim() : "",
    name: $("si-name") ? $("si-name").value.trim() : ""
  };
  try { localStorage.setItem(STUDENT_KEY, JSON.stringify(info)); } catch (e) {}
}

function cloudNote(html, ok) {
  const el = $("submitStatus");
  if (el) el.innerHTML = `<div class="cloud-note ${ok ? "ok" : "warn"}">${html}</div>`;
}

async function submitToCloud() {
  const cfg = window.CLOUD_CONFIG || {};
  const btn = $("submitBtn");
  if (!cfg.enabled || !cfg.appId || !cfg.appKey) {
    cloudNote("云端尚未配置：请老师先在 cloud-config.js 中填入云端密钥后重新发布。你的数据仍会自动保存在本机。", false);
    return;
  }
  const info = loadStudentInfo();
  if (!info.sid || !info.name) {
    cloudNote("请先返回首页填写<b>学号</b>和<b>姓名</b>（班级、组别选填），再回来提交作业。", false);
    return;
  }
  collectAll();
  if (btn) btn.disabled = true;
  const tables = TABLES.filter(t => t.id !== "setup");
  try {
    for (let i = 0; i < tables.length; i++) {
      const t = tables[i];
      cloudNote(`正在提交：${esc(t.title)}（${i + 1}/${tables.length}）…`, true);
      const payload = {
        studentId: info.sid,
        studentName: info.name,
        className: info.cls || "",
        group: info.grp || "",
        tableId: t.id,
        tableTitle: t.title,
        data: JSON.stringify(data[t.id] || { header: {}, station: {}, orient: {}, rows: [] }),
        updatedAt: new Date().toISOString()
      };
      await CLOUD.upsert(payload);
    }
    cloudNote("提交成功 ✓ 老师已收到你的全部数据（" + new Date().toLocaleString() + "）。再次填写后可以重新提交覆盖。", true);
  } catch (e) {
    cloudNote("提交失败：" + esc((e && e.message) || "网络异常，请检查网络后重试") + "。你的数据仍保存在本机，不会丢失。", false);
  } finally {
    if (btn) btn.disabled = false;
  }
}
